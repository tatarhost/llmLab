name: CI & Multi-Platform Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate multi-res Windows icon (assets/icon.ico)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pillow
          python -m py_compile scripts/make_icon.py
          python scripts/make_icon.py
          if (-not (Test-Path "assets/icon.ico")) {
            throw "assets/icon.ico was not generated"
          }

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (cargo fmt)
        run: cargo fmt --all -- --check || cargo fmt --all

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --verbose

      - name: Build release binary (llmLab.exe)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package llmLab-win64.zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/llmLab.exe" "dist/"
          Copy-Item "README.md" "dist/"
          Copy-Item "config.example.toml" "dist/"
          Compress-Archive -Path "dist/*" -DestinationPath "llmLab-win64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: llmLab-win64.zip

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM64 cross-linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy lints (Linux)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests (Linux)
        run: cargo test --verbose

      - name: Build Linux x86_64 & arm64 binaries
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
          cargo build --release --target aarch64-unknown-linux-gnu

          mkdir -p dist-x64 dist-arm64
          cp target/x86_64-unknown-linux-gnu/release/llmLab README.md config.example.toml dist-x64/
          tar -czf llmLab-linux-x86_64.tar.gz -C dist-x64 .

          cp target/aarch64-unknown-linux-gnu/release/llmLab README.md config.example.toml dist-arm64/
          tar -czf llmLab-linux-arm64.tar.gz -C dist-arm64 .

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            llmLab-linux-x86_64.tar.gz
            llmLab-linux-arm64.tar.gz

  build-termux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (Android Termux aarch64)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build Android Termux arm64 binary via preinstalled NDK
        run: |
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            NDK_DIR="$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n1)"
          fi
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CLANG_BIN="$(ls "$TOOLCHAIN"/aarch64-linux-android2*-clang 2>/dev/null | sort -V | head -n1)"
          CLANGXX_BIN="$(ls "$TOOLCHAIN"/aarch64-linux-android2*-clang++ 2>/dev/null | sort -V | head -n1)"
          AR_BIN="$TOOLCHAIN/llvm-ar"

          echo "Using Android NDK CC: $CLANG_BIN"
          export CC_aarch64_linux_android="$CLANG_BIN"
          export CXX_aarch64_linux_android="$CLANGXX_BIN"
          export AR_aarch64_linux_android="$AR_BIN"
          export TARGET_CC="$CLANG_BIN"
          export TARGET_AR="$AR_BIN"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CLANG_BIN"

          cargo build --release --target aarch64-linux-android

          mkdir -p dist-termux
          cp target/aarch64-linux-android/release/llmLab README.md config.example.toml dist-termux/
          tar -czf llmLab-termux-arm64.tar.gz -C dist-termux .

      - name: Upload Termux artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-termux
          path: llmLab-termux-arm64.tar.gz

  release:
    needs: [build-windows, build-linux, build-termux]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform archives
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-files
        run: |
          sha256sum llmLab-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Versioned GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/llmLab-*
            release-files/SHA256SUMS.txt
          generate_release_notes: true

      - name: Publish Rolling Release on main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: llmLab Latest Build
          make_latest: true
          files: |
            release-files/llmLab-*
            release-files/SHA256SUMS.txt
