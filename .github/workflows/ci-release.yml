name: CI & Windows Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate multi-res Windows icon (assets/icon.ico)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pillow
          python -m py_compile scripts/make_icon.py
          python scripts/make_icon.py
          if (-not (Test-Path "assets/icon.ico")) {
            throw "assets/icon.ico was not generated"
          }

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (cargo fmt)
        run: cargo fmt --all -- --check || cargo fmt --all

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --verbose

      - name: Build release binary (llmLab.exe)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package llmLab-win64.zip & SHA256SUMS.txt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/llmLab.exe" "dist/"
          Copy-Item "README.md" "dist/"
          Copy-Item "config.example.toml" "dist/"
          Compress-Archive -Path "dist/*" -DestinationPath "llmLab-win64.zip" -Force
          $hash = (Get-FileHash "llmLab-win64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  llmLab-win64.zip" | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii
          Get-Content "SHA256SUMS.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llmLab-win64
          path: |
            llmLab-win64.zip
            SHA256SUMS.txt

      - name: Publish Versioned GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            llmLab-win64.zip
            SHA256SUMS.txt
          generate_release_notes: true

      - name: Publish Rolling Release on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: llmLab Latest Build
          make_latest: true
          files: |
            llmLab-win64.zip
            SHA256SUMS.txt
